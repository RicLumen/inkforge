name: check

on:
  push:
  pull_request:

jobs:
  docs-and-counting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Documentation pointer check
        run: python3 short-story-skill/scripts/check_pointers.py
      - name: Counting script regression tests
        run: python3 short-story-skill/scripts/test_count_chapters.py
